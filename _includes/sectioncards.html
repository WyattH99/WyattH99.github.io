<div class='flex items-center justify-center'>
  <div class="aspect-video rounded-xl relative group">
        {% if include.link_label %}
        <span class="absolute top-2 right-2 z-10 rounded-md bg-zinc-900/80 px-2 py-1 text-xs text-white group-hover:text-[#FAB406] transition-colors duration-300">{{ include.link_label }} ↗</span>
        {% endif %}
        {% if include.video %}
        <video
            class="rounded-lg object-cover w-full aspect-video"
            autoplay loop muted playsinline
            poster="{{ include.poster }}"
            aria-label="{{ include.heading }}">
            <source src="{{ include.video }}" type="video/webm">
        </video>
        {% else %}
        <img
            alt="{{ include.heading }}"
            class="rounded-lg object-cover w-full aspect-video"
            loading="lazy"
            decoding="async"
            src="{{ include.picture }}"
            />
        {% endif %}
            <div class="space-y-3 text-xl ">
                <h3 class="font-bold">{{ include.heading }}</h3>
                <div class="text-left md:text-justify opacity-80 text-sm">{{ include.paragraph }}</div>
            </div>
    </div>
 </div>
