<!DOCTYPE html>
<html lang="en" class="motion-safe:scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }}</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <meta name="description" content="{{ site.description | strip }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ site.description | strip }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link href="/assets/tailwindstyles.css" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Wyatt Hansen",
      "jobTitle": "Embedded Software Engineer",
      "worksFor": { "@type": "Organization", "name": "Accelsius", "url": "https://accelsius.com" },
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}/assets/Headshot.jpeg",
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Texas A&M University" }
      ],
      "sameAs": [
        "https://github.com/WyattH99",
        "https://www.linkedin.com/in/wyatth99"
      ]
    }
    </script>
    <script>
      // Project videos load lazily: nothing downloads until a video nears the
      // viewport, then it starts playing (muted, inline). Save-Data / 2G /
      // prefers-reduced-motion users get poster-until-tap instead — src is set
      // with preload="none", so pressing play is what triggers the download.
      addEventListener('DOMContentLoaded', function () {
        var conn = navigator.connection || {};
        var frugal =
          conn.saveData ||
          /(^|-)2g$/.test(conn.effectiveType || '') ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var vids = document.querySelectorAll('video[data-src]');
        if (frugal || !('IntersectionObserver' in window)) {
          vids.forEach(function (v) {
            v.src = v.dataset.src;
            v.controls = true;
          });
          return;
        }
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              var v = e.target;
              io.unobserve(v);
              v.src = v.dataset.src;
              v.play().catch(function () {
                v.controls = true;
              });
            });
          },
          { rootMargin: '400px' }
        );
        vids.forEach(function (v) {
          io.observe(v);
        });
      });
    </script>
</head>
<body>
    <div class="min-h-screen flex flex-col justify-between">

        {% include header.html %}

        {{ content }}

        {% include footer.html %}

    </div>
</body>
</html>
