<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <meta name="description" content="{{ site.description | strip }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ site.description | strip }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link href="/assets/tailwindstyles.css" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen flex flex-col justify-between">

        {% include header.html %}

        {{ content }}

        {% include footer.html %}

    </div>
</body>
</html>
