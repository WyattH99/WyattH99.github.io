- heading: Mastering Microcontroller and Embedded Driver Development
  url: https://www.udemy.com/course/mastering-microcontroller-with-peripheral-driver-development/
  link_label: Course
  picture: ./assets/Diplomas/UdemyEmbeddedDriverDevelopment.webp
  paragraph: >-
    I completed this course using a STM32 Nucleo F446RE Board and acquired a
    comprehensive understanding of Driver Development, Peripheral IRQs/Vector
    table/NVIC interfaces, AHB & APB bus protocols, and MCU Peripherals such as
    GPIO, SPI, I2C and USART.

- heading: Mastering RTOS
  url: https://www.udemy.com/course/mastering-rtos-hands-on-with-freertos-arduino-and-stm32fx/
  link_label: Course
  picture: ./assets/Diplomas/UdemyFreeRTOS.webp
  paragraph: >-
    I completed this course using a STM32 Nucleo Board and acquired a comprehensive
    understanding of RTOS principles, encompassing key concepts such as Tasks,
    Scheduling, Semaphores, Queues, Mutexes, Context Switching, and advanced
    debugging techniques employing SEGGER SystemView.

- heading: Embedded Systems Programming on ARM Cortex-M3/M4 Processor
  url: https://www.udemy.com/course/embedded-system-programming-on-arm-cortex-m3m4/
  link_label: Course
  picture: ./assets/Diplomas/UdemyEmbeddedSystemsProgramming.webp
  paragraph: >-
    I completed this course using a STM32 Nucleo Board and acquired a comprehensive
    understanding of Embedded Systems principles, encompassing key concepts such as
    C, Inline Assembly, Bus Interfaces, NVIC, Exception Handling, IRQ, and
    implemented a task scheduler using Round Robin Prioritization, PENDSV and
    SYSTICK.
