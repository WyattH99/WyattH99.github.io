- heading: Countries of the World Game
  url: https://countriesofthe.world
  link_label: Play
  wide: true
  video: ./assets/EngineeringProjects/CountriesOfTheWorld.webm
  poster: ./assets/EngineeringProjects/CountriesOfTheWorld_poster.webp
  tags: "React, TypeScript, WebGL2, Node, Postgres, SSE, AI-Directed (Claude Code)"
  paragraph: >-
    Designed and launched a multiplayer geography game where players race the clock
    to type or find all 197 countries on an ASCII-art world map, featuring eight game
    modes across the modern world, five historical eras, Pangaea, and the US states.
    I developed this project entirely by directing AI coding agents (Claude Code):
    I owned the product direction, specified the features and gameplay rules, made
    the architecture decisions, reviewed the generated code, and tested every release
    on real desktop and mobile devices. The game runs on React and TypeScript with a
    WebGL2 map renderer, and a Hono and Node backend handling real-time multiplayer
    over Server-Sent Events, worldwide Postgres leaderboards, and anti-cheat telemetry.
    Deployed and operated in production on DigitalOcean behind Cloudflare. Check it
    out and play a game at countriesofthe.world!

- heading: Composition Helper
  url: https://github.com/JamesVorder/compositio_nn
  link_label: GitHub
  wide: true
  video: ./assets/EngineeringProjects/CompositionHelper.webm
  poster: ./assets/EngineeringProjects/CompositionHelper_poster.webp
  tags: "PyTorch, DINOv3, Computer Vision, ONNX Runtime Web, WebGPU, Progressive Web App"
  paragraph: >-
    A collaborative research project on composition-aware aesthetic assessment, built
    on the Composition Assessment DataBase (CADB). We reproduced the SAMP-Net baseline
    and compared three DINOv3 architectures predicting the same five-bin quality
    distribution; the partially unfrozen backbone improved MSE, SRCC, and LCC over the
    baseline with EMD parity. The project also includes an on-device demo: a
    progressive web app that runs the fine-tuned model entirely on an iPhone through
    ONNX Runtime Web on WebGPU, scoring a photo in about 190 ms with no server and no
    network after the first load. It shows a 1-5 composition score, a percentile
    against the model's own CADB predictions, and ranked probabilities for all 14
    composition techniques, drawing each technique's guide over the photo. Check out
    the code on GitHub!
