# Site settings
# These are used to personalize your new site. If you look in Jekyll's
# _config.yml, you'll see they are set by default.

title: Wyatt Hansen
email: wyatthansen99@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Wyatt Hansen's personal portfolio website showcasing projects, experiences, and diplomas & certifications.
baseurl: "" # empty for user sites (username.github.io)
url: "https://wyatth99.github.io" # the base hostname & protocol for your site
repository: WyattH99/WyattH99.github.io

# Build settings
# github-pages gem handles most of the build settings for Jekyll on GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-github-metadata

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be re-included by adding them to the `include:` key.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - README.md
  - ROADMAP.md
